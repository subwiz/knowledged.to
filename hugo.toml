baseURL = "https://knowledged.to/"
languageCode = "en-us"
title = "knowledged.to"
theme = "PaperMod"
enableRobotsTXT = true

ignoreLogs = ['warning-goldmark-raw-html']

[pagination]
  pagerSize = 20

[params]
  homepageMode = "posts"
  mainSections = ["notes", "ai", "videos"]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = true
  defaultTheme = "auto"

[params.assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"
  theme_color = "#111827"
  msapplication_TileColor = "#111827"

[outputs]
  home = ["HTML", "RSS", "JSON"]
